networks:
  iot-net:
    driver: bridge

volumes:
  influxdb-data:
  grafana-data:
  recordings-data:

services:

  # ─────────────────────────────────────────────
  # InfluxDB v2  (Time-Series Database)
  # ─────────────────────────────────────────────
  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    restart: unless-stopped
    networks:
      - iot-net
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=${DOCKER_INFLUXDB_INIT_MODE}
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Grafana  (Web Dashboard, port 3000)
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    restart: unless-stopped
    networks:
      - iot-net
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=
    depends_on:
      influxdb:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Python Modbus Logger
  # ─────────────────────────────────────────────
  modbus-logger:
    build: .
    container_name: modbus-logger
    restart: unless-stopped
    networks:
      - iot-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - MODBUS_HOST=${MODBUS_HOST}
      - MODBUS_PORT=${MODBUS_PORT}
      - MODBUS_UNIT_ID=${MODBUS_UNIT_ID}
      - MODBUS_START_ADDRESS=${MODBUS_START_ADDRESS}
      - MODBUS_REGISTER_COUNT=${MODBUS_REGISTER_COUNT}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS}
      - INFLUXDB_URL=${INFLUXDB_URL}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - BATCH_FLUSH_INTERVAL_SEC=${BATCH_FLUSH_INTERVAL_SEC}
      - BATCH_SIZE=${BATCH_SIZE}
    depends_on:
      influxdb:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # Web UI Control Panel (port 8080)
  # ─────────────────────────────────────────────
  web-ui:
    build: .
    container_name: web-ui
    restart: unless-stopped
    networks:
      - iot-net
    ports:
      - "8080:8080"
    volumes:
      - recordings-data:/app/recordings
    command: gunicorn --chdir /app/core --bind 0.0.0.0:8080 --workers 2 --threads 4 web_ui:app
    environment:
      - INFLUXDB_URL=${INFLUXDB_URL}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - MODBUS_START_ADDRESS=${MODBUS_START_ADDRESS}
      - MODBUS_REGISTER_COUNT=${MODBUS_REGISTER_COUNT}
    depends_on:
      influxdb:
        condition: service_healthy
