apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    uid: influxdb-provisioned
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: iot-org
      defaultBucket: plc_data
      tlsSkipVerify: true
    secureJsonData:
      token: my-super-secret-token
    isDefault: true
    editable: true
